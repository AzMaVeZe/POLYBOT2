<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelZit — תוצאות טורניר</title>
<meta name="theme-color" content="#0f172a">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card-2:#273449;--text:#e2e8f0;--muted:#a5b4c8;--accent:#38bdf8;--accent-2:#0ea5e9;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;--green:#34d399;--red:#f87171;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
  .container{max-width:560px;margin:0 auto}
  h1{text-align:center;font-size:1.5rem;margin:8px 0 2px}
  .subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .card h2{font-size:1.05rem;margin-bottom:12px;color:var(--accent)}
  .podium-first{text-align:center;padding:10px 0 4px}
  .podium-first .medal{font-size:3rem;line-height:1}
  .podium-first .name{font-size:1.6rem;font-weight:900;margin:6px 0 2px;overflow-wrap:anywhere}
  .podium-first .score{color:var(--gold);font-weight:800}
  .podium-rest{display:flex;justify-content:center;gap:24px;padding:14px 0 6px;flex-wrap:wrap}
  .podium-rest .p{text-align:center;min-width:110px}
  .podium-rest .medal{font-size:1.8rem}
  .podium-rest .name{font-weight:700;overflow-wrap:anywhere}
  .podium-rest .score{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:start;color:var(--muted);font-size:.78rem;padding:6px 8px;border-bottom:1px solid #334155}
  th.num,td.num{text-align:end}
  td{padding:10px 8px;border-bottom:1px solid #2b3a52;font-size:.95rem;overflow-wrap:anywhere}
  td.num{font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:.8rem;background:var(--card-2);color:var(--muted)}
  .rank-1{background:var(--gold);color:#422006}.rank-2{background:var(--silver);color:#1e293b}.rank-3{background:var(--bronze);color:#3a1d02}
  .pts{font-weight:800;color:var(--accent)}
  .cta{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06283d;font-weight:800;font-size:1rem}
  .note{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 0}
</style>
</head>
<body>
<div class="container">
  <h1>🎾 PadelZit</h1>
  <div class="subtitle" id="subtitle">תוצאות טורניר</div>
  <div id="content"><div class="note" id="loading">טוען תוצאות…</div></div>
  <a class="cta" id="cta" href="./">➕ פתחו טורניר משלכם — חינם</a>
  <div class="note">אמריקנו · ניקוד פאדל · PadelZit</div>
</div>
<script>
const SB = 'https://axrugdszycwmadbdwolx.supabase.co';
const KEY = 'sb_publishable_DJKbYBC-m4TcUbM2D1gSlQ_WQfJW-1m';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function rankOrder(t){
  const diff=i=>{let d=0;t.history.forEach(g=>{if(g.teamA.includes(i))d+=g.scoreA-g.scoreB;else if(g.teamB.includes(i))d+=g.scoreB-g.scoreA;});return d;};
  return [...Array(t.players.length).keys()].sort((x,y)=>t.points[y]-t.points[x]||t.gamesWon[y]-t.gamesWon[x]||diff(y)-diff(x));
}

function render(t){
  const order=rankOrder(t);
  const line=i=>t.points[i]+' נק׳ · '+t.gamesWon[i]+' נצ׳';
  const medals=['🥇','🥈','🥉'];
  let h='<div class="card"><h2>🎉 תוצאות הטורניר</h2>';
  h+='<div class="podium-first"><div class="medal">🥇</div><div class="name">'+esc(t.players[order[0]])+'</div><div class="score">'+line(order[0])+'</div></div>';
  h+='<div class="podium-rest">';
  for(let k=1;k<3&&k<order.length;k++) h+='<div class="p"><div class="medal">'+medals[k]+'</div><div class="name">'+esc(t.players[order[k]])+'</div><div class="score">'+line(order[k])+'</div></div>';
  h+='</div></div>';
  h+='<div class="card"><h2>הטבלה הסופית</h2><table><thead><tr><th>#</th><th>שחקן</th><th class="num">נקודות</th><th class="num">נצ׳</th><th class="num">מש׳</th></tr></thead><tbody>';
  order.forEach((i,idx)=>{h+='<tr><td><span class="rank-badge rank-'+(idx+1)+'">'+(idx+1)+'</span></td><td>'+esc(t.players[i])+'</td><td class="num pts">'+t.points[i]+'</td><td class="num">'+t.gamesWon[i]+'</td><td class="num">'+t.gamesPlayed[i]+'</td></tr>';});
  h+='</tbody></table></div>';
  document.getElementById('content').innerHTML=h;
  const d=new Date(t.createdAt);
  if(!isNaN(d)) document.getElementById('subtitle').textContent=d.toLocaleDateString('he-IL');
}

(async()=>{
  const id=new URLSearchParams(location.search).get('t');
  const fail=m=>{document.getElementById('content').innerHTML='<div class="note">'+m+'</div>';};
  if(!id){fail('קישור לא תקין.');return;}
  try{
    const res=await fetch(SB+'/rest/v1/tournaments?id=eq.'+encodeURIComponent(id)+'&select=data',{headers:{apikey:KEY}});
    if(!res.ok) throw new Error('http');
    const rows=await res.json();
    if(!rows.length||!rows[0].data){fail('התוצאות לא נמצאו או שאינן ציבוריות.');return;}
    render(rows[0].data);
  }catch(e){fail('לא ניתן לטעון את התוצאות כרגע.');}
})();
</script>
</body>
</html>
