<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelZit — תוצאות טורניר</title>
<meta name="description" content="צפו בתוצאות טורניר הפאדל בשידור חי — דירוג, נקודות ופודיום. PadelZit.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PadelZit — פאדלז׳יט">
<meta property="og:title" content="🎾 תוצאות טורניר פאדל — שידור חי">
<meta property="og:description" content="דירוג, נקודות ופודיום בזמן אמת. הקישו כדי לצפות — או פִתחו טורניר משלכם, חינם.">
<meta property="og:image" content="https://azmaveze.github.io/PadelZit/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="פאדלז׳יט — תוצאות טורניר פאדל">
<meta property="og:locale" content="he_IL">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🎾 תוצאות טורניר פאדל — שידור חי">
<meta name="twitter:description" content="דירוג, נקודות ופודיום בזמן אמת — PadelZit.">
<meta name="twitter:image" content="https://azmaveze.github.io/PadelZit/og.png">
<meta name="theme-color" content="#0f172a">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--card-2:#273449;--text:#e2e8f0;--muted:#a5b4c8;--accent:#38bdf8;--accent-2:#0ea5e9;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#d97706;--green:#34d399;--red:#f87171;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
  .container{max-width:560px;margin:0 auto}
  h1{text-align:center;font-size:1.5rem;margin:8px 0 2px}
  .subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:14px}
  .live-badge{display:none;align-items:center;justify-content:center;gap:8px;margin:0 auto 16px;width:max-content;background:#450a0a;color:#fecaca;font-weight:800;font-size:.8rem;padding:6px 14px;border-radius:999px}
  .live-badge.on{display:flex}
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.5)}}
  @media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
  .card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .card h2{font-size:1.05rem;margin-bottom:12px;color:var(--accent)}
  .match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
  .match .team{background:var(--card-2);border-radius:12px;padding:12px 8px;text-align:center;font-weight:700;overflow-wrap:anywhere}
  .match .vs{display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800}
  .resting{color:var(--muted);font-size:.85rem;text-align:center;margin-top:10px}
  .podium-first{text-align:center;padding:10px 0 4px}
  .podium-first .medal{font-size:3rem;line-height:1}
  .podium-first .name{font-size:1.6rem;font-weight:900;margin:6px 0 2px;overflow-wrap:anywhere}
  .podium-first .score{color:var(--gold);font-weight:800}
  .podium-rest{display:flex;justify-content:center;gap:24px;padding:14px 0 6px;flex-wrap:wrap}
  .podium-rest .p{text-align:center;min-width:110px}
  .podium-rest .medal{font-size:1.8rem}
  .podium-rest .name{font-weight:700;overflow-wrap:anywhere}
  .podium-rest .score{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse}
  th{text-align:start;color:var(--muted);font-size:.78rem;padding:6px 8px;border-bottom:1px solid #334155}
  th.num,td.num{text-align:end}
  td{padding:10px 8px;border-bottom:1px solid #2b3a52;font-size:.95rem;overflow-wrap:anywhere}
  td.num{font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:.8rem;background:var(--card-2);color:var(--muted)}
  .rank-1{background:var(--gold);color:#422006}.rank-2{background:var(--silver);color:#1e293b}.rank-3{background:var(--bronze);color:#3a1d02}
  .pts{font-weight:800;color:var(--accent)}
  .cta{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#06283d;font-weight:800;font-size:1rem}
  .note{text-align:center;color:var(--muted);font-size:.85rem;padding:20px 0}
</style>
</head>
<body>
<div class="container">
  <h1>🎾 PadelZit</h1>
  <div class="subtitle" id="subtitle">תוצאות טורניר</div>
  <div class="live-badge" id="live-badge"><span class="live-dot"></span><span id="live-text">שידור חי</span></div>
  <div id="content"><div class="note" id="loading">טוען תוצאות…</div></div>
  <a class="cta" id="cta" href="./">➕ פתחו טורניר משלכם — חינם</a>
  <div class="note">אמריקנו · מקסיקנו · ניקוד פאדל · PadelZit</div>
</div>
<script>
const SB = 'https://axrugdszycwmadbdwolx.supabase.co';
const KEY = 'sb_publishable_DJKbYBC-m4TcUbM2D1gSlQ_WQfJW-1m';
const POLL_MS = 5000;
let timer = null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function rankOrder(t){
  const diff=i=>{let d=0;t.history.forEach(g=>{if(g.teamA.includes(i))d+=g.scoreA-g.scoreB;else if(g.teamB.includes(i))d+=g.scoreB-g.scoreA;});return d;};
  return [...Array(t.players.length).keys()].sort((x,y)=>t.points[y]-t.points[x]||t.gamesWon[y]-t.gamesWon[x]||diff(y)-diff(x));
}

function table(t){
  const order=rankOrder(t);
  let h='<div class="card"><h2>🏆 דירוג</h2><table><thead><tr><th>#</th><th>שחקן</th><th class="num">נקודות</th><th class="num">נצ׳</th><th class="num">מש׳</th></tr></thead><tbody>';
  order.forEach((i,idx)=>{h+='<tr><td><span class="rank-badge rank-'+(idx+1)+'">'+(idx+1)+'</span></td><td>'+esc(t.players[i])+'</td><td class="num pts">'+t.points[i]+'</td><td class="num">'+t.gamesWon[i]+'</td><td class="num">'+t.gamesPlayed[i]+'</td></tr>';});
  h+='</tbody></table></div>';
  return h;
}

function renderLive(t){
  document.getElementById('live-badge').classList.add('on');
  let h='';
  if(t.next&&Array.isArray(t.next[0])){
    const nm=i=>esc(t.players[i]);
    const a=t.next[0].map(nm).join(' + '), b=t.next[1].map(nm).join(' + ');
    const onCourt=new Set([].concat(t.next[0],t.next[1]));
    const resting=[...Array(t.players.length).keys()].filter(i=>!onCourt.has(i)).map(i=>esc(t.players[i]));
    h+='<div class="card"><h2>▶ משחק נוכחי</h2><div class="match"><div class="team">'+a+'</div><div class="vs">נגד</div><div class="team">'+b+'</div></div>';
    if(resting.length) h+='<div class="resting">😴 נחים: '+resting.join(', ')+'</div>';
    h+='</div>';
  }
  h+=table(t);
  document.getElementById('content').innerHTML=h;
}

function renderFinal(t){
  document.getElementById('live-badge').classList.remove('on');
  const order=rankOrder(t);
  const line=i=>t.points[i]+' נק׳ · '+t.gamesWon[i]+' נצ׳';
  const medals=['🥇','🥈','🥉'];
  let h='<div class="card"><h2>🎉 תוצאות הטורניר</h2>';
  h+='<div class="podium-first"><div class="medal">🥇</div><div class="name">'+esc(t.players[order[0]])+'</div><div class="score">'+line(order[0])+'</div></div>';
  h+='<div class="podium-rest">';
  for(let k=1;k<3&&k<order.length;k++) h+='<div class="p"><div class="medal">'+medals[k]+'</div><div class="name">'+esc(t.players[order[k]])+'</div><div class="score">'+line(order[k])+'</div></div>';
  h+='</div></div>';
  h+=table(t).replace('🏆 דירוג','הטבלה הסופית');
  document.getElementById('content').innerHTML=h;
}

function render(t){
  const d=new Date(t.createdAt);
  if(!isNaN(d)) document.getElementById('subtitle').textContent=d.toLocaleDateString('he-IL')+(t.format==='mexicano'?' · מקסיקנו':'');
  if(t.finished){ renderFinal(t); if(timer){clearInterval(timer);timer=null;} }
  else renderLive(t);
}

async function poll(id){
  try{
    const res=await fetch(SB+'/rest/v1/tournaments?id=eq.'+encodeURIComponent(id)+'&select=data',{headers:{apikey:KEY}});
    if(!res.ok) throw new Error('http');
    const rows=await res.json();
    if(!rows.length||!rows[0].data){document.getElementById('content').innerHTML='<div class="note">התוצאות לא נמצאו או שאינן ציבוריות.</div>';if(timer){clearInterval(timer);timer=null;}return;}
    render(rows[0].data);
  }catch(e){ /* keep last render; try again next tick */ }
}

(async()=>{
  const id=new URLSearchParams(location.search).get('t');
  if(!id){document.getElementById('content').innerHTML='<div class="note">קישור לא תקין.</div>';return;}
  await poll(id);
  timer=setInterval(()=>poll(id),POLL_MS);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){if(timer){clearInterval(timer);timer=null;}} else if(!timer){poll(id);timer=setInterval(()=>poll(id),POLL_MS);} });
})();
</script>
</body>
</html>
