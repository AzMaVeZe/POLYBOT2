<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- Google Play feature graphic: exactly 1024x500, no alpha.
     Play may overlay a play-button in the centre and crops the outer edges on
     some surfaces, so the brand sits right-of-centre and nothing critical
     touches the margins. Render with marketing/play/shot-play-assets.js. -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(900px 500px at 88% -10%, rgba(56,189,248,.22), transparent 60%),
      radial-gradient(760px 500px at 4% 115%, rgba(251,191,36,.15), transparent 55%),
      linear-gradient(150deg,#0b1526 0%,#0f172a 55%,#111e36 100%);
    color:#e2e8f0;position:relative;
  }
  .court{position:absolute;inset:0;opacity:.10}
  .court span{position:absolute;background:#7dd3fc}
  .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 78px}
  .left{display:flex;flex-direction:column;gap:22px;max-width:640px}
  .top{display:flex;align-items:center;gap:20px}
  .ball{width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#eaf6a4,#c6f23f 55%,#9ac70f);
    box-shadow:0 10px 30px rgba(154,199,15,.35),inset -8px -10px 18px rgba(0,0,0,.18);
    position:relative;flex:0 0 auto;overflow:hidden}
  .ball::before{content:"";position:absolute;top:-6px;left:-64px;width:150%;height:150%;
    border:3px solid rgba(255,255,255,.85);border-radius:50%;clip-path:inset(0 64% 0 0)}
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand .he{font-size:66px;font-weight:900;letter-spacing:-1px}
  .brand .en{font-size:24px;font-weight:800;letter-spacing:6px;color:#38bdf8;margin-top:8px}
  .headline{font-size:40px;font-weight:900;line-height:1.18}
  .headline .hl{color:#fbbf24}
  .badges{display:flex;gap:10px;flex-wrap:nowrap;white-space:nowrap}
  .badge{background:rgba(30,41,59,.85);border:1px solid rgba(148,163,184,.25);color:#e2e8f0;
    font-size:19px;font-weight:800;padding:10px 18px;border-radius:999px}
  .badge.accent{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#06283d;border:none}
  .badge.gold{background:linear-gradient(135deg,#fbbf24,#fde68a);color:#422006;border:none}
  /* podium visual on the trailing side */
  .podium{display:flex;align-items:flex-end;gap:14px;transform:rotate(-1deg);margin-inline-end:26px}
  .bar{width:64px;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;
    justify-content:flex-start;padding-top:10px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .bar .medal{font-size:30px}
  .bar.b1{height:172px;background:linear-gradient(180deg,#fbbf24,#b8860b)}
  .bar.b2{height:128px;background:linear-gradient(180deg,#cbd5e1,#7c899b)}
  .bar.b3{height:98px;background:linear-gradient(180deg,#d97706,#8a4b06)}
</style>
</head>
<body>
  <div class="court">
    <span style="top:0;bottom:0;left:50%;width:3px"></span>
    <span style="left:0;right:0;top:50%;height:3px"></span>
    <span style="top:48px;bottom:48px;left:48px;width:3px"></span>
    <span style="top:48px;bottom:48px;right:48px;width:3px"></span>
    <span style="left:48px;right:48px;top:48px;height:3px"></span>
    <span style="left:48px;right:48px;bottom:48px;height:3px"></span>
  </div>

  <div class="wrap">
    <div class="left">
      <div class="top">
        <div class="ball"></div>
        <div class="brand">
          <span class="he">פאדלז׳יט</span>
          <span class="en">PADELZIT</span>
        </div>
      </div>
      <div class="headline">אמריקנו ומקסיקנו<br><span class="hl">בלי בלגן של חישובים</span></div>
      <div class="badges">
        <span class="badge accent">4–12 שחקנים</span>
        <span class="badge">הזוגות מתערבבים</span>
        <span class="badge gold">🏆 טבלת חברים</span>
      </div>
    </div>

    <div class="podium">
      <div class="bar b2"><div class="medal">🥈</div></div>
      <div class="bar b1"><div class="medal">🥇</div></div>
      <div class="bar b3"><div class="medal">🥉</div></div>
    </div>
  </div>
</body>
</html>
