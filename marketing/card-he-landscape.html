<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 600px at 88% -10%, rgba(56,189,248,.20), transparent 60%),
      radial-gradient(900px 600px at 5% 115%, rgba(251,191,36,.14), transparent 55%),
      linear-gradient(150deg,#0b1526 0%,#0f172a 55%,#111e36 100%);
    color:#e2e8f0;position:relative;
  }
  /* court lines, faint */
  .court{position:absolute;inset:0;opacity:.10}
  .court span{position:absolute;background:#7dd3fc}
  .frame{position:absolute;top:64px;bottom:64px;left:64px;right:64px}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:70px 84px}
  .top{display:flex;align-items:center;gap:22px}
  .ball{width:92px;height:92px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#eaf6a4,#c6f23f 55%,#9ac70f);
    box-shadow:0 10px 30px rgba(154,199,15,.35),inset -8px -10px 18px rgba(0,0,0,.18);position:relative;flex:0 0 auto;overflow:hidden}
  .ball::before{content:"";position:absolute;top:-6px;left:-70px;width:150%;height:150%;
    border:3px solid rgba(255,255,255,.85);border-radius:50%;clip-path:inset(0 64% 0 0)}
  .brand{display:flex;flex-direction:column;line-height:1}
  .brand .he{font-size:78px;font-weight:900;letter-spacing:-1px}
  .brand .en{font-size:30px;font-weight:800;letter-spacing:6px;color:#38bdf8;margin-top:8px}
  .headline{font-size:62px;font-weight:900;line-height:1.12;max-width:900px;text-wrap:balance}
  .headline .hl{color:#fbbf24}
  .sub{font-size:30px;color:#a5b4c8;margin-top:20px;font-weight:600}
  .badges{display:flex;gap:16px;margin-top:6px;flex-wrap:wrap}
  .badge{background:rgba(30,41,59,.85);border:1px solid rgba(148,163,184,.25);color:#e2e8f0;
    font-size:26px;font-weight:800;padding:12px 24px;border-radius:999px}
  .badge.accent{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#06283d;border:none}
  .badge.gold{background:linear-gradient(135deg,#fbbf24,#fde68a);color:#422006;border:none}
  /* mini podium card, bottom-left visual */
  .podium{position:absolute;left:96px;bottom:150px;display:flex;align-items:flex-end;gap:16px;transform:rotate(-1deg)}
  .bar{width:70px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#273449,#1b2740);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
  .bar .medal{font-size:34px}
  .bar.b1{height:150px;background:linear-gradient(180deg,#fbbf24,#b8860b)}
  .bar.b2{height:112px;background:linear-gradient(180deg,#cbd5e1,#7c899b)}
  .bar.b3{height:86px;background:linear-gradient(180deg,#d97706,#8a4b06)}
  .bar .medal.dark{filter:none}
</style>
</head>
<body>
  <div class="court">
    <span style="top:0;bottom:0;left:50%;width:3px"></span>
    <span style="left:0;right:0;top:50%;height:3px"></span>
    <span style="top:64px;bottom:64px;left:64px;width:3px"></span>
    <span style="top:64px;bottom:64px;right:64px;width:3px"></span>
    <span style="left:64px;right:64px;top:64px;height:3px"></span>
    <span style="left:64px;right:64px;bottom:64px;height:3px"></span>
  </div>

  <div class="podium">
    <div class="bar b2"><div class="medal">🥈</div></div>
    <div class="bar b1"><div class="medal">🥇</div></div>
    <div class="bar b3"><div class="medal">🥉</div></div>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="ball"></div>
      <div class="brand">
        <div class="he">פאדלז׳יט</div>
        <div class="en">P A D E L Z I T</div>
      </div>
    </div>

    <div>
      <div class="headline">ניהול טורניר פאדל <span class="hl">אמריקנו ומקסיקנו</span><br>ניקוד חי, דירוג ושיתוף</div>
      <div class="sub">מזינים תוצאות — כולם רואים את הדירוג בשידור חי</div>
    </div>

    <div class="badges">
      <div class="badge accent">חינם</div>
      <div class="badge">ללא הרשמה</div>
      <div class="badge gold">4–8 שחקנים</div>
      <div class="badge">עברית · PWA</div>
    </div>
  </div>
</body>
</html>
