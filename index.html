/* ---------- rendering ---------- */

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function teamLabel(tour, team) {
  return team.map(i =>
    '<button type="button" class="pname' + (swapSel === i ? ' swap-sel' : '') + '"' +
    ' aria-pressed="' + (swapSel === i) + '" onclick="tapSwap(' + i + ')">' +
    escapeHtml(tour.players[i]) + '</button>').join('<br>');
}

function teamLabelInline(tour, team) {
  const sep = lang === 'he' ? ' ו־' : ' & ';
  return team.map(i => tour.players[i]).join(sep);
}

// Remembers each player's last-rendered points so the cell can count up to the new value.
let ptsCache = {};

function renderLeaderboardInto(tbodyId, tour) {
  const order = rankOrder(tour);
  const tbody = document.getElementById(tbodyId);
  tbody.innerHTML = '';
  let myClaim = session ? (tour.claims || {})[session.user.id] : undefined;
  if (myClaim === undefined && Number.isInteger(tour.meIndex)) myClaim = tour.meIndex;
  let prevKey = null, prevRank = 0;
  order.forEach((i, idx) => {
    const d = diffOf(tour, i);
    const key = tour.points[i] + '/' + tour.gamesWon[i] + '/' + d;
    const rank = key === prevKey ? prevRank : idx + 1;
    prevKey = key; prevRank = rank;
    const cacheKey = tbodyId + ':' + tour.id + ':' + tour.players[i];
    const prevPts = ptsCache[cacheKey];
    // The "me" slot (chosen at setup) gets a star.
    let nameCell = escapeHtml(tour.players[i]);
    if (myClaim === i) nameCell += '<span class="me-star" title="' + escapeHtml(t('claimedMe')) + '">⭐</span>';
    const tr = document.createElement('tr');
    tr.setAttribute('data-player', tour.players[i]);
    tr.innerHTML =
      '<td><span class="rank-badge' + (tour.history.length ? ' rank-' + rank : '') + '">' + rank + '</span></td>' +
      '<td>' + nameCell + '</td>' +
      '<td class="num pts">' + (prevPts != null ? prevPts : tour.points[i]) + '</td>' +
      '<td class="num diff ' + (d > 0 ? 'pos' : d < 0 ? 'neg' : '') + '"><bdi>' + (d > 0 ? '+' : '') + d + '</bdi></td>' +
      '<td class="num">' + tour.gamesWon[i] + '</td>' +
      '<td class="num">' + tour.gamesPlayed[i] + '</td>';
    tbody.appendChild(tr);
    const ptsCell = tr.querySelector('.pts');
    if (prevPts != null && prevPts !== tour.points[i]) countUp(ptsCell, tour.points[i], 600);
    else ptsCell.textContent = tour.points[i];
    ptsCache[cacheKey] = tour.points[i];
  });
}

function renderHistory(tour) {
  const list = document.getElementById('history-list');
  if (tour.history.length === 0) {
    list.innerHTML = '<div class="empty-ball" aria-hidden="true">' + BRAND_BALL_SVG + '</div><div class="empty-note">' + t('empty') + '</div>';
    return;
  }
  // Preserve values typed into an open edit row across re-renders
  // (language toggle, target change) instead of silently discarding them.
  const stashA = document.getElementById('edit-a') ? document.getElementById('edit-a').value : null;
  const stashB = document.getElementById('edit-b') ? document.getElementById('edit-b').value : null;
  list.innerHTML = '';
  [...tour.history].reverse().forEach((g, revIdx) => {
    const index = tour.history.length - 1 - revIdx;
    const gameNo = index + 1;
    const aWins = g.scoreA > g.scoreB;
    const bWins = g.scoreB > g.scoreA;
    const gTarget = g.target || tour.target;
    const div = document.createElement('div');
    div.className = 'history-item';
    let html =
      '<span class="game-no"><bdi>#' + gameNo + '</bdi></span>' +
      '<span class="result">' +
        '<span class="' + (aWins ? 'winner' : '') + '">' + escapeHtml(teamLabelInline(tour, g.teamA)) + '</span>' +
        ' ' + (lang === 'he' ? 'נגד' : 'vs') + ' ' +
        '<span class="' + (bWins ? 'winner' : '') + '">' + escapeHtml(teamLabelInline(tour, g.teamB)) + '</span>' +
      '</span>';
    if (editingIndex === index) {
      const valA = stashA !== null ? stashA : g.scoreA;
      const valB = stashB !== null ? stashB : g.scoreB;
      html +=
        '<div class="edit-row">' +
          '<input type="number" id="edit-a" min="0" inputmode="numeric" aria-label="' + escapeHtml(t('sharePts') + ': ' + teamLabelInline(tour, g.teamA)) + '" value="' + escapeHtml(String(valA)) + '" oninput="editAutoFill(\'A\')">' +
          '<span class="dash">—</span>' +
          '<input type="number" id="edit-b" min="0" inputmode="numeric" aria-label="' + escapeHtml(t('sharePts') + ': ' + teamLabelInline(tour, g.teamB)) + '" value="' + escapeHtml(String(valB)) + '" oninput="editAutoFill(\'B\')">' +
          '<button type="button" class="icon-btn ok" onclick="saveEdit(' + index + ')" aria-label="' + escapeHtml(t('editSave')) + '">✔</button>' +
          '<button type="button" class="icon-btn cancel" onclick="cancelEdit()" aria-label="' + escapeHtml(t('editCancel')) + '">✕</button>' +
        '</div>' +
        '<div class="edit-error" id="edit-error" role="alert"></div>';
    } else {
      html +=
        '<span class="history-score">' + g.scoreA + '–' + g.scoreB + '</span>' +
        (gTarget !== tour.target ? '<span class="history-target"><bdi dir="ltr">🎯 ' + gTarget + '</bdi></span>' : '') +
        '<button type="button" class="icon-btn" onclick="startEdit(' + index + ')" title="' + escapeHtml(t('editTitle')) + '" aria-label="' + escapeHtml(t('editTitle')) + '">✎</button>' +
        '<button type="button" class="icon-btn danger' + (pendingDeleteGame === index ? ' confirm' : '') + '" onclick="deleteGame(' + index + ')" title="' +
          escapeHtml(pendingDeleteGame === index ? t('delGameConfirm') : t('delGame')) + '" aria-label="' +
          escapeHtml(pendingDeleteGame === index ? t('delGameConfirm') : t('delGame')) + '">🗑</button>';
    }
    div.innerHTML = html;
    list.appendChild(div);
  });
}

function renderGame(tour) {
  const n = tour.history.length;
  const nPlayers = tour.players.length;
  let label = t('game') + ' ' + (tour.next2 ? (n + 1) + '–' + (n + 2) : (n + 1));
  if (tour.format === 'mexicano') {
    label += ' · ' + t('fmtLabelMex');
  } else if (nPlayers === 4) {
    const round = Math.floor(n / 3) + 1;
    const inRound = (n % 3) + 1;
    label += ' · ' + t('round') + ' ' + round + ' (' + inRound + '/3)';
  }
  document.getElementById('round-label').textContent = label;
  document.getElementById('game-target').value = tour.target;
  document.getElementById('sum-hint').textContent = t('sumHint', tour.target);
  const [teamA, teamB] = currentPairing(tour);
  document.getElementById('teamA-names').innerHTML = teamLabel(tour, teamA);
  document.getElementById('teamB-names').innerHTML = teamLabel(tour, teamB);
  document.getElementById('scoreA').setAttribute('aria-label', teamLabelInline(tour, teamA));
  document.getElementById('scoreB').setAttribute('aria-label', teamLabelInline(tour, teamB));
  // Court 2 (8+ players): show the parallel match with its own score inputs.
  const court2 = document.getElementById('court2-block');
  document.getElementById('court1-label').classList.toggle('hidden', !tour.next2);
  court2.classList.toggle('hidden', !tour.next2);
  const onCourt = new Set([...teamA, ...teamB]);
  if (tour.next2) {
    const [teamA2, teamB2] = tour.next2;
    document.getElementById('teamA2-names').innerHTML = teamLabel(tour, teamA2);
    document.getElementById('teamB2-names').innerHTML = teamLabel(tour, teamB2);
    document.getElementById('scoreA2').setAttribute('aria-label', t('court2') + ' — ' + teamLabelInline(tour, teamA2));
    document.getElementById('scoreB2').setAttribute('aria-label', t('court2') + ' — ' + teamLabelInline(tour, teamB2));
    teamA2.forEach(i => onCourt.add(i)); teamB2.forEach(i => onCourt.add(i));
  }
  const restEl = document.getElementById('resting-label');
  const resting = [...Array(nPlayers).keys()].filter(i => !onCourt.has(i));
  if (resting.length > 0) {
    restEl.innerHTML = escapeHtml(t('resting')) + ': ' + resting.map(i =>
      '<button type="button" class="pname' + (swapSel === i ? ' swap-sel' : '') + '"' +
      ' aria-pressed="' + (swapSel === i) + '" onclick="tapSwap(' + i + ')">' +
      escapeHtml(tour.players[i]) + '</button>').join('، '.replace('،', ','));
    restEl.classList.remove('hidden');
  } else {
    restEl.classList.add('hidden');
  }
  renderLeaderboardInto('leaderboard-body', tour);
  renderHistory(tour);
  // Live-share card: works for everyone — guests broadcast through the
  // device write-token channel, no account needed.
  document.getElementById('live-card').classList.remove('hidden');
  const shareBtn = document.getElementById('share-live-btn');
  const shareRow = document.getElementById('live-share');
  if (tour.isPublic) {
    shareBtn.classList.add('hidden');
    shareRow.classList.remove('hidden');
    document.getElementById('live-wa').href = 'https://wa.me/?text=' +
      encodeURIComponent(t('liveWaText') + '\n' + publicUrl(tour));
  } else {
    shareBtn.classList.remove('hidden');
    shareRow.classList.add('hidden');
  }
}

function renderPodium(tour) {
  const order = rankOrder(tour);
  const scoreLine = i => tour.points[i] + ' ' + t('sharePts') + ' · ' + tour.gamesWon[i] + ' ' + t('shareWins');
  const champ = order[0];
  document.getElementById('pod-1-name').textContent = tour.players[champ];
  const p1 = document.getElementById('pod-1-score');
  p1.innerHTML = '<span id="pod-1-pts">0</span> ' + escapeHtml(t('sharePts')) + ' · ' +
    tour.gamesWon[champ] + ' ' + escapeHtml(t('shareWins'));
  countUp(document.getElementById('pod-1-pts'), tour.points[champ], 700);
  document.getElementById('pod-2-name').textContent = tour.players[order[1]];
  document.getElementById('pod-2-score').textContent = scoreLine(order[1]);
  document.getElementById('pod-3-name').textContent = tour.players[order[2]];
  document.getElementById('pod-3-score').textContent = scoreLine(order[2]);
  renderLeaderboardInto('final-body', tour);
  const wa = document.getElementById('wa-link');
  wa.href = 'https://wa.me/?text=' + encodeURIComponent(shareText(tour));
  document.getElementById('share-fallback').classList.add('hidden');
  // Public-link card: available to everyone — guests publish via the
  // device write-token channel.
  const linkCard = document.getElementById('share-link-card');
  const makeBtn = document.getElementById('make-public-btn');
  const live = document.getElementById('public-live');
  linkCard.classList.remove('hidden');
  makeBtn.disabled = false;
  if (tour.isPublic) { makeBtn.classList.add('hidden'); live.classList.remove('hidden'); }
  else { makeBtn.classList.remove('hidden'); live.classList.add('hidden'); }
  // Replay the medal entrance on each podium view.
  if (!REDUCE) {
    ['.podium-first .medal', '.podium-rest .p:nth-child(1) .medal', '.podium-rest .p:nth-child(2) .medal']
      .forEach(sel => { const el = document.querySelector(sel); if (el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; } });
  }
}

function renderHome() {
  updateInstallUI();
  renderCloud();
  const list = document.getElementById('tournament-list');
  if (db.tournaments.length === 0) {
    list.innerHTML = '<div class="empty-ball" aria-hidden="true">' + BRAND_BALL_SVG + '</div><div class="empty-note">' + t('noTours') + '</div>';
  } else {
    list.innerHTML = '';
    db.tournaments.forEach(tour => {
      const order = rankOrder(tour);
      const top = tour.players[order[0]];
      const div = document.createElement('div');
      div.className = 'tour-item';
      const date = new Date(tour.createdAt).toLocaleDateString(STR[lang].locale);
      const statusCls = tour.finished ? 'done' : 'live';
      const statusTxt = tour.finished ? t('done') : t('live');
      const subject = tour.history.length > 0
        ? (tour.finished ? '🥇 ' + escapeHtml(top) + ' ' + t('winner') + ' · ' : '👑 ' + escapeHtml(top) + ' ' + t('leader') + ' · ')
        : '';
      const delLabel = pendingDeleteId === tour.id ? t('delConfirm') : t('del');
      div.innerHTML =
        '<div class="tour-head">' +
          '<span class="tour-date">' + date + '</span>' +
          '<span class="tour-status ' + statusCls + '">' + statusTxt + '</span>' +
        '</div>' +
        '<div class="tour-sub">' + subject + tour.players.map(escapeHtml).join(', ') + ' · ' + tour.history.length + ' ' + t('games') + '</div>' +
        '<div class="tour-actions">' +
          '<button type="button" onclick="openTournament(\'' + escapeHtml(tour.id) + '\')">' + (tour.finished ? t('viewPodium') : t('continueTour')) + '</button>' +
          '<button type="button" class="del" onclick="deleteTournament(\'' + escapeHtml(tour.id) + '\')">' + delLabel + '</button>' +
        '</div>';
      list.appendChild(div);
    });
  }

  // Personal stats: aggregate the slots the signed-in user claimed as "me".
  const myCard = document.getElementById('mystats-card');
  const uid = session ? session.user.id : null;
  if (uid) {
    let pts = 0, won = 0, games = 0, tours = 0, titles = 0;
    db.tournaments.forEach(tour => {
      const i = (tour.claims || {})[uid];
      if (i === undefined) return;
      tours++; pts += tour.points[i]; won += tour.gamesWon[i]; games += tour.gamesPlayed[i];
      if (tour.finished && tour.history.length > 0 && rankOrder(tour)[0] === i) titles++;
    });
    if (tours > 0) {
      myCard.classList.remove('hidden');
      document.getElementById('mystats-body').innerHTML =
        '<div class="mystats-grid">' +
          '<div><div class="v">' + tours + '</div><div class="k">' + t('myStatsTours') + '</div></div>' +
          '<div><div class="v">' + pts + '</div><div class="k">' + t('myStatsPts') + '</div></div>' +
          '<div><div class="v">' + won + '</div><div class="k">' + t('myStatsWon') + '</div></div>' +
          '<div><div class="v">' + titles + '</div><div class="k">' + t('myStatsTitles') + '</div></div>' +
        '</div>';
    } else { myCard.classList.add('hidden'); }
  } else { myCard.classList.add('hidden'); }

  // All-time leaderboard across every tournament, keyed by player name.
  const agg = {};
  db.tournaments.forEach(tour => {
    tour.players.forEach((name, i) => {
      const key = name.trim();
      if (!agg[key]) agg[key] = { pts: 0, games: 0, won: 0, titles: 0 };
      agg[key].pts += tour.points[i];
      agg[key].games += tour.gamesPlayed[i];
      agg[key].won += tour.gamesWon[i];
    });
    if (tour.finished && tour.history.length > 0) {
      const champ = tour.players[rankOrder(tour)[0]].trim();
      agg[champ].titles++;
    }
  });
  const names = Object.keys(agg).sort((a, b) =>
    agg[b].titles - agg[a].titles || agg[b].pts - agg[a].pts || agg[b].won - agg[a].won);
  const card = document.getElementById('alltime-card');
  if (names.length === 0) {
    card.classList.add('hidden');
  } else {
    card.classList.remove('hidden');
    const tbody = document.getElementById('alltime-body');
    tbody.innerHTML = '';
    names.forEach(name => {
      const a = agg[name];
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + escapeHtml(name) + '</td>' +
        '<td class="num">' + (a.titles > 0 ? '🏆'.repeat(Math.min(a.titles, 3)) + (a.titles > 3 ? '×' + a.titles : '') : '—') + '</td>' +
        '<td class="num pts">' + a.pts + '</td>' +
        '<td class="num">' + a.games + '</td>' +
        '<td class="num">' + a.won + '</td>';
      tbody.appendChild(tr);
    });
  }
}

function render() {
  const screens = { home: 'home-screen', setup: 'setup-screen', game: 'game-screen', podium: 'podium-screen' };
  Object.values(screens).forEach(id => document.getElementById(id).classList.add('hidden'));
  const tour = current();
  if ((view === 'game' || view === 'podium') && !tour) view = 'home';
  const activeEl = document.getElementById(screens[view]);
  activeEl.classList.remove('hidden');
  activeEl.classList.remove('screen-in');
  void activeEl.offsetWidth;
  activeEl.classList.add('screen-in');
  renderCloud(); // keep the user chip / cloud card correct on every screen
  if (view === 'home') renderHome();
  else if (view === 'setup') renderSetup();
  else if (view === 'game') renderGame(tour);
  else if (view === 'podium') renderPodium(tour);
}

document.getElementById('setup-form').addEventListener('submit', e => {
  e.preventDefault();
  startTournament();
});

// User-menu dismissal: Escape and outside-click close it and restore focus to the chip.
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeUserMenu(); });
document.addEventListener('click', e => {
  const menu = document.getElementById('user-menu');
  if (menu.classList.contains('hidden')) return;
  const chip = document.getElementById('user-chip');
  if (!menu.contains(e.target) && !chip.contains(e.target)) toggleUserMenu(false);
});

// Another tab wrote to storage — re-read so this tab doesn't clobber its games.
window.addEventListener('storage', e => {
  if (e.key !== DB_KEY) return;
  const prevActive = activeId;
  loadDb();
  if (prevActive && !db.tournaments.some(x => x.id === prevActive)) {
    activeId = null;
    if (view === 'game' || view === 'podium') view = 'home';
  }
  render();
});

// ---- Install ("Add to Home Screen") + service-worker update handling ----
const PWA_HOST = ('serviceWorker' in navigator) &&
  (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
  !location.hostname.endsWith('claude.ai');

let deferredPrompt = null;
let waitingWorker = null;
let reloadingForUpdate = false;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function isIos() { return /iP(hone|ad|od)/i.test(navigator.userAgent); }

function updateInstallUI() {
  const row = document.getElementById('install-row');
  const btn = document.getElementById('install-btn');
  const hint = document.getElementById('install-hint');
  if (!PWA_HOST || isStandalone()) { row.classList.add('hidden'); return; }
  row.classList.remove('hidden');
  if (deferredPrompt) {
    btn.classList.remove('hidden');
    hint.textContent = '';
  } else {
    btn.classList.add('hidden');
    hint.textContent = isIos() ? t('installHintIos') : t('installHintGeneric');
  }
}

async function doInstall() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch (e) {}
  deferredPrompt = null;
  updateInstallUI();
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  updateInstallUI();
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  updateInstallUI();
  showToast(t('installedToast'));
});

function showUpdateBanner(worker) {
  waitingWorker = worker;
  document.getElementById('update-banner').classList.remove('hidden');
}
function applyUpdate() {
  if (waitingWorker) {
    reloadingForUpdate = true;
    waitingWorker.postMessage({ type: 'SKIP_WAITING' });
  }
}

if (PWA_HOST) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // A waiting worker already present (update downloaded on a previous visit).
      if (reg.waiting && navigator.serviceWorker.controller) showUpdateBanner(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner(nw);
        });
      });
    }).catch(() => {});
    // Reload to pick up new assets only after the user tapped Refresh
    // (not on the initial claim, which also fires controllerchange).
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloadingForUpdate) location.reload();
    });
  });
}

document.querySelector('#brand-h1 .title-ball').innerHTML = BRAND_BALL_SVG;
loadDb();
loadSession();
// Scope local data to the restored account (claims pre-existing guest data for
// the signed-in user; wipes it if it belonged to a different account).
reconcileOwner();
// Reopen the most recent tournament automatically if it's still live.
if (db.tournaments.length > 0 && !db.tournaments[0].finished) {
  activeId = db.tournaments[0].id;
  view = 'game';
} else {
  view = 'home';
}
applyLang();
render();
// Complete an OAuth redirect if we just came back from Google/Facebook,
// otherwise resume any stored session.
handleOAuthRedirect().then(loggedIn => {
  if (loggedIn) { reconcileOwner(); renderCloud(); render(); syncNow(true); }
  else if (session) syncNow(true);
});
// Safety net: if OAuth tokens arrive without a full reload, process them too.
window.addEventListener('hashchange', () => {
  if ((location.hash || '').indexOf('access_token=') !== -1) {
    handleOAuthRedirect().then(ok => { if (ok) { reconcileOwner(); renderCloud(); render(); syncNow(true); } });
  }
});
</script>
</body>
